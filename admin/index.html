<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <!-- 다크 모드를 스스로 지원한다고 알려서 삼성 인터넷 등이 화면을 억지로 어둡게 바꾸지 않게 -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15141d" media="(prefers-color-scheme: dark)">
  <title>관리자 모드 · 리센느 오늘의 할일</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- 홈 화면에 "리센느 관리자" 앱으로 따로 추가 → 새 공지 푸시 알림 (아이폰은 홈 화면 앱에서만 돼요) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="리센느 관리">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>(function () { var t = 'auto'; try { t = localStorage.getItem('rs-theme') || 'auto'; } catch (e) {} var d = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); })();</script>
  <link rel="stylesheet" href="../style.css?v=262">
  <link rel="stylesheet" href="admin.css?v=262">
</head>
<body class="adm-body">
  <!-- 화면은 고정하고 이 안만 스크롤해요 (사이트 앱과 같은 방식) → 아이폰에서 아래 저장 줄이 스크롤 따라 밀려 올라가지 않아요 -->
  <div id="admScroll">
    <header class="adm-top">
      <div class="container adm-top-in">
        <a class="adm-home" href="../">리센느 오늘의 할일</a>
        <b>관리자 모드</b>
        <span class="adm-bell" id="admBell"></span>
        <button type="button" class="btn small" id="admOut" hidden>나가기</button>
      </div>
    </header>
    <main id="adm" class="container" aria-live="polite"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="../config.js?v=262"></script>
  <script src="admin.js?v=262"></script>
</body>
</html>
