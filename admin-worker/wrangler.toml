# 관리자 모드 저장 서버. 올리기: 이 폴더에서 npx wrangler deploy
# 비밀값 3개는 코드에 적지 않고 한 번만 넣어요:
#   npx wrangler secret put GH_TOKEN        (GitHub fine-grained 토큰)
#   npx wrangler secret put ADMIN_PASSWORD  (관리자 비밀번호)
#   npx wrangler secret put SIGN_KEY        (아무 긴 글자. 바꾸면 모든 기기 로그인이 풀려요)
name = "rescene-admin"
main = "worker.js"
compatibility_date = "2025-06-01"

# 비밀번호 찍어 보기 막기: 한 IP에서 1분에 5번까지
[[ratelimits]]
name = "LOGIN"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 10분마다 GitHub 예약 작업(X 공지 · blip · 음방 편성표 · 자료 점검) 실행 버튼을 대신 눌러요 (worker.js due)
[triggers]
crons = ["*/10 * * * *"]
