name: 음총팀 X 공지 받기

# 10분마다(관리자 워커가 실행 버튼을 대신 눌러요) 음총팀 X(@ResceneStream) 새 글을 받아 data/inbox.json(관리자 모드 "받은 공지" 대기 목록)에 쌓아요.
# 사이트에는 바로 나가지 않아요. 관리자 모드에서 고르면 그때 올라가요. 자세한 건 tools/crawl_x.py 맨 위.
# 필요한 비밀값 (Settings → Secrets and variables → Actions): X_AUTH_TOKEN · X_CT0 (수집용 X 계정의 로그인 쿠키)
# GitHub 사정으로 몇 분 늦게 돌 수 있어요. Actions 탭에서 직접 실행도 가능.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write

concurrency:
  group: x-inbox
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 예비 예약의 중복 수집 확인
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_crawl_backup.py x-inbox.yml 10
      - uses: actions/setup-python@v5
        if: env.SKIP_CRAWL != 'yes'
        with:
          python-version: '3.12'
      - name: 도구 설치
        if: env.SKIP_CRAWL != 'yes'
        # curl-cffi: 크롬처럼 접속해요 (X 임베드 주소에서 받기, tools/crawl_x.py 맨 위)
        run: pip install -q 'curl-cffi>=0.9,<1'
      - name: 받고 바뀌었으면 저장
        if: env.SKIP_CRAWL != 'yes'
        id: push
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 관리자 모드가 그 사이 같은 파일을 고쳤을 수 있어서, 밀어 넣기가 막히면 최신으로 받고 처음부터 다시
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python tools/crawl_x.py
            git add data/inbox.json
            if git diff --cached --quiet; then echo 'changed=no' >> "$GITHUB_OUTPUT"; exit 0; fi
            git commit -q -m "음총팀 X 공지 받기 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
            if git push -q; then echo 'changed=yes' >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: GitHub Pages 자료 새로 게시
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      # 기본 토큰으로 올린 커밋은 push 작업을 깨우지 않아서 미러 동기화를 직접 요청해요.
      - name: Cloudflare 미러 동기화 요청
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare.yml --ref main
