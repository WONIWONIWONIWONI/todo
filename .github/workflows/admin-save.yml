name: 관리자 저장

# 관리자 모드(…/todo/admin/)에서 저장하면 커밋 메시지가 "관리자:"로 시작해요.
# 그 커밋만 받아서 publish.py와 같은 검사(CSV 검사 · 화면 점검)를 거쳐 사이트에 올려요.
# 검사에서 막히면 그 관리자 커밋을 되돌려서, 틀린 자료가 저장소에 남지 않게 해요.
on:
  push:
    branches: [main]
    paths:
      - 'sheet-templates/**'
      - 'data/weekly.json'
  workflow_dispatch:   # Actions 탭에서 직접 실행: 검사하고 다시 올리기만 (되돌리기 없음)

permissions:
  contents: write
  pages: write

concurrency:
  group: admin-save
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '관리자:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사하고 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/publish.py --ci "${MSG:-다시 올리기}"
      - name: 막혔으면 되돌리기
        if: failure() && github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch -q --depth=2 origin "$SHA"
          git fetch -q origin main
          # 이미 올라간 뒤(사이트 반영 기다리기에서 시간만 넘김)면 되돌리지 않아요
          if git log --format=%s "$SHA"..origin/main | grep -q '^v[0-9]'; then echo "이미 올라감 — 되돌리지 않음"; exit 0; fi
          git reset -q --hard origin/main
          # 그 관리자 커밋이 바꾼 파일만, 그 전 내용으로 되돌려요 (다른 파일은 절대 건드리지 않음)
          git diff --name-only -z "$SHA^" "$SHA" > changed.lst
          [ -s changed.lst ] || { echo "바뀐 파일을 못 찾아서 멈춤"; exit 1; }
          xargs -0 git checkout "$SHA^" -- < changed.lst
          rm changed.lst
          n=$(git diff --cached --name-only | wc -l)
          if [ "$n" -gt 6 ] || ! git diff --cached --diff-filter=D --quiet; then echo "되돌릴 내용이 이상해서 멈춤 ($n개 파일)"; git reset -q --hard origin/main; exit 1; fi
          git commit -q -m "되돌림: $(git log -1 --format=%s "$SHA") (검사에서 막힘)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
