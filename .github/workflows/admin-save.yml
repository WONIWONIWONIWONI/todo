name: 관리자 저장

# 관리자 모드(…/todo/admin/)에서 저장하면 커밋 메시지가 "관리자:"로 시작해요.
# 그 커밋만 받아서 publish.py와 같은 검사(CSV 검사 · 화면 점검)를 거쳐 사이트에 올려요.
# 검사에서 막히면 그 관리자 커밋을 되돌려서, 틀린 자료가 저장소에 남지 않게 해요.
on:
  push:
    branches: [main]
    paths:
      - 'sheet-templates/**'
      - 'data/weekly.json'
      - 'data/notice.json'
  workflow_dispatch:   # Actions 탭에서 직접 실행: 검사하고 다시 올리기만 (되돌리기 없음)

permissions:
  contents: write
  pages: write

concurrency:
  group: admin-save
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '관리자:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사하고 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/publish.py --ci "${MSG:-다시 올리기}"
      - name: 막혔으면 되돌리기
        if: failure() && github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          mapfile -d '' files < <(git diff --name-only -z "$SHA^" "$SHA")
          if (( ${#files[@]} < 1 || ${#files[@]} > 6 )); then echo "되돌릴 파일 수 확인 필요"; exit 1; fi
          for attempt in 1 2 3; do
            git fetch -q origin main
            base=$(git rev-parse origin/main)
            # 이미 배포한 자료와 같은 파일의 후속 편집을 보호해요.
            if [[ -n $(git log -1 --format=%s --grep='^v[0-9]' "$SHA..$base") ]]; then echo "후속 배포가 있어 복구 생략"; exit 0; fi
            if ! git diff --quiet "$SHA" "$base" -- "${files[@]}"; then
              echo "::error::후속 편집이 있어 자동 복구를 중단했어요. 아래 파일의 변경을 확인해 주세요."
              git -c core.quotePath=false diff --name-only "$SHA" "$base" -- "${files[@]}"
              exit 1
            fi
            git reset -q --hard "$base"
            git restore --source="$SHA^" --staged --worktree -- "${files[@]}"
            if ! git diff --cached --diff-filter=D --quiet; then echo "파일 삭제가 필요해 수동 확인"; exit 1; fi
            git commit -q -m "되돌림: $(git log -1 --format=%s "$SHA") (검사에서 막힘)"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "::error::원격 변경으로 복구를 마치지 못했어요."
          exit 1
