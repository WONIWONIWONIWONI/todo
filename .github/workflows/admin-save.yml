name: 관리자 저장
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: admin-publication
  cancel-in-progress: false
jobs:
  publish:
    if: startsWith(github.ref_name, 'admin-drafts/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 초안 검사 후 공개 자료에 반영
        id: release
        env:
          RELEASE_BROWSER_CHECK: '1'
        run: python tools/promote_draft.py
      - name: 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: 반영된 버전 확인
        env:
          PUBLISHED_SHA: ${{ steps.release.outputs.published_sha }}
        run: |
          git fetch origin main
          export RELEASE_VERSION=$(git show "$PUBLISHED_SHA:index.html" | sed -n 's/.*app.js?v=\([0-9]*\).*/\1/p' | head -1)
          python tools/verify_live.py
      - name: Cloudflare 미러 사이트 동기화
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISHED_SHA: ${{ steps.release.outputs.published_sha }}
        run: |
          git checkout --detach "$PUBLISHED_SHA"
          python tools/deploy_cloudflare.py --pages-only --skip-unchanged
          git checkout --detach "$GITHUB_SHA"
      - name: 받은 공지 처리 완료 확정
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/finalize_draft.py "$GITHUB_REPOSITORY"
      - name: 실패 시 초안 위치 안내
        if: failure()
        run: echo '::error::자료·초안은 보존했어요. 공개 자료를 자동으로 되돌리지 않아요. 검사·충돌·배포 중 실패한 단계의 로그를 확인하고 다시 실행하세요.'
