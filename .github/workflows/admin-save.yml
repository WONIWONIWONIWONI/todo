name: 관리자 저장

# 관리자 모드(…/todo/admin/)에서 저장하면 커밋 메시지가 "관리자:"로 시작해요.
# 그 커밋만 받아서 publish.py와 같은 검사(CSV 검사 · 화면 점검)를 거쳐 사이트에 올려요.
# 검사에서 막히면 그 관리자 커밋을 되돌려서, 틀린 자료가 저장소에 남지 않게 해요.
on:
  push:
    branches: [main]
    paths:
      - 'sheet-templates/**'
      - 'data/weekly.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: admin-save
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, '관리자:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사하고 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python tools/publish.py --ci "${MSG#관리자: }"
      - name: 막혔으면 되돌리기
        if: failure()
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch -q origin main
          # 이미 올라간 뒤(사이트 반영 기다리기에서 시간만 넘김)면 되돌리지 않아요
          if git log --format=%s "$SHA"..origin/main | grep -q '^v[0-9]'; then echo "이미 올라감 — 되돌리지 않음"; exit 0; fi
          git reset --hard "$SHA"
          git revert --no-edit "$SHA"
          git commit --amend -m "되돌림: $(git log -1 --format=%s "$SHA") (검사에서 막힘)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
