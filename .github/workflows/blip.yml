name: blip 스케줄 받기

# 3시간마다 blip 리센느 일정을 받아 data/blip.json 을 갱신해요. (Actions 탭에서 직접 실행도 가능)
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: blip
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: blip 일정 받기
        run: python tools/crawl_blip.py
      - name: 바뀌었으면 저장
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blip.json data/rescene.ics
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "blip 일정 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 올리기
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
