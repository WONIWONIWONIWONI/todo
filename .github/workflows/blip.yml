name: blip 스케줄 받기

# 30분마다 blip 리센느 일정을 받아 data/blip.json 을 갱신해요. (Actions 탭에서 직접 실행도 가능)
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write

concurrency:
  group: blip
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 예비 예약의 중복 수집 확인
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_crawl_backup.py blip.yml 30
      - uses: actions/setup-python@v5
        if: env.SKIP_CRAWL != 'yes'
        with:
          python-version: '3.12'
      - name: blip 일정 받기
        if: env.SKIP_CRAWL != 'yes'
        run: python tools/crawl_blip.py
      - name: 바뀌었으면 저장
        if: env.SKIP_CRAWL != 'yes'
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blip.json data/rescene.ics
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "blip 일정 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          pushed=no
          for i in 1 2 3; do if git pull --rebase && git push; then pushed=yes; break; fi; sleep 5; done
          test "$pushed" = yes
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 올리기
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      # 기본 토큰으로 올린 커밋은 push 작업을 깨우지 않아서 미러 동기화를 직접 요청해요.
      - name: Cloudflare 미러 동기화 요청
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare.yml --ref main
