name: 음방 편성표 받기

# 3시간마다 방송사 공식 편성표에서 음방 방송 시간을 받아 data/onair.json 을,
# 공식 출연진 공지에서 리센느 출연 여부를 받아 data/lineup.json 을 갱신해요.
# 무엇을 어떻게 받는지는 tools/crawl_onair.py · tools/crawl_lineup.py 맨 위에 적어 뒀어요. (Actions 탭에서 직접 실행도 가능)
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: onair
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 예비 예약의 중복 수집 확인
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_crawl_backup.py onair.yml 180
      - uses: actions/setup-python@v5
        if: env.SKIP_CRAWL != 'yes'
        with:
          python-version: '3.12'
      - name: 편성표 받기
        if: env.SKIP_CRAWL != 'yes'
        run: python tools/crawl_onair.py
      - name: 출연진 받기
        if: env.SKIP_CRAWL != 'yes'
        continue-on-error: true  # 실패해도 편성표는 저장 (오래 못 받으면 자료 점검이 알려 줘요)
        run: python tools/crawl_lineup.py
      - name: 바뀌었으면 저장
        if: env.SKIP_CRAWL != 'yes'
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/onair.json data/lineup.json
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "음방 편성표 · 출연진 갱신 $(TZ=Asia/Seoul date +'%m-%d %H:%M')"
          pushed=no
          for i in 1 2 3; do if git pull --rebase && git push; then pushed=yes; break; fi; sleep 5; done
          test "$pushed" = yes
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: 사이트 다시 올리기
        if: steps.push.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
