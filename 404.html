<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>리센느 오늘의 할일</title>
  <script>
    // …/todo/calendar 같은 화면 주소로 바로 들어오면, 사이트 첫 페이지로 보내면서 그 화면을 열어요.
    (function () {
      var parts = location.pathname.split('/');
      var base = '/' + (parts[1] || '') + '/';           // 예: /todo/
      var seg = (parts[2] || '').replace(/\.html$/, '');
      var tabs = ['today', 'calendar', 'schedule', 'music', 'alliances', 'guides'];
      if (tabs.indexOf(seg) >= 0) {
        var arg = location.hash ? location.hash.slice(1) : (parts[3] || '');
        location.replace(base + '#' + seg + (arg ? '/' + arg : ''));
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f4f6; color: #191f28; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #101013; color: #f4f4f6; } a { color: #ffb8d3; } }
    main { text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: inherit; opacity: .75; }
    a { color: #8a2450; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지예요.</p>
    <a href="/todo/">리센느 오늘의 할일로 가기</a>
  </main>
</body>
</html>
